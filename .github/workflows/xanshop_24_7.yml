name: XAN SHOP 24/7 Autonomous AI Office

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Har 5 soatda avtomatik yangi 24/7 sessiya ulanadi (uzluksiz ishlash uchun)
    - cron: "0 */5 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: xanshop-24-7-live
  cancel-in-progress: true

jobs:
  run-office:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.11 & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js for Remotion Studio
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies, Remotion & Cloudflared
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
          playwright install chromium || true
          if [ -f remotion_studio/package.json ]; then
            npm --prefix remotion_studio install --no-audit --no-fund
          fi
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start Cloudflared HTTPS Tunnel & XAN SHOP 24/7 Server
        env:
          SALES_BOT_TOKEN: ${{ secrets.SALES_BOT_TOKEN }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_PHONE: ${{ secrets.TG_PHONE }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          MANAGER_USERNAME: ${{ secrets.MANAGER_USERNAME }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BROWSER_SESSION_B64: ${{ secrets.IG_BROWSER_SESSION_B64 }}
          PDD_RAPIDAPI_KEY: ${{ secrets.PDD_RAPIDAPI_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          CARD_NUMBER: "9860 3501 4182 4135"
          CARD_OWNER: "POLVONOV BEKMUROD"
          AUTO_POST_HOURS: "6.0"
          APIFY_MAX_MONTHLY_USD: "4.20"
          APIFY_MAX_DAILY_CALLS: "3"
          PROFIT_PERCENT: "55"
          ENSURE_50_COVERS_COST: "1"
          PREPAY_ROUND_TO: "50000"
          USE_OMNIROUTE: "1"
        run: |
          if [ -n "$IG_BROWSER_SESSION_B64" ]; then
            mkdir -p data
            echo "$IG_BROWSER_SESSION_B64" | base64 -d > data/ig_browser_session.json || true
          fi
          ./cloudflared tunnel --url http://localhost:8080 --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 1 20); do
            TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done
          export PUBLIC_BASE_URL="${TUNNEL_URL:-https://xanshop.uz}"
          echo "Cloudflare Tunnel URL: $PUBLIC_BASE_URL"
          START_TS=$(date +%s)
          timeout 310m python -u main.py || true
          ELAPSED=$(( $(date +%s) - START_TS ))
          echo "RUN_ELAPSED=$ELAPSED" >> $GITHUB_ENV

      - name: Persist SQLite DB state
        if: always()
        run: |
          git config user.name "xanshop-bot"
          git config user.email "bekxan1004@gmail.com"
          git add -f data/shop.db data/pdd_live_cache.json data/photos/look_*.jpg data/photos/look_*_reels.mp4 || true
          git diff --staged --quiet || git commit -m "chore: sync 24/7 shop.db state [skip ci]"
          git pull --rebase -X ours origin main || true
          git push origin main || true

      - name: Auto-Chain Next 24/7 Session
        if: always() && env.RUN_ELAPSED != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ "${RUN_ELAPSED:-0}" -ge 120 ]; then
            curl -s -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/xanshop_24_7.yml/dispatches \
              -d '{"ref":"main"}' || true
          else
            echo "Session exited early (${RUN_ELAPSED}s); skipping immediate auto-chain (cron will retry)."
          fi
